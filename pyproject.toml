[project]
name = "respiratory-mcp-server"
version = "0.1.0"
description = "Respiratory Season Situational Awareness MCP Server — GSA MCP Hackathon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "epiweeks>=2.1.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
resp-mcp-server = "resp_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resp_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "arize-phoenix>=18.0.0",
    "arize-phoenix-client>=2.13.0",
    "arize-phoenix-evals>=3.1.1",
    "langchain[mcp]>=1.5.2,<2",
    "langchain-openai>=1.3.5",
    "openinference-instrumentation-langchain>=0.1.67",
    "opentelemetry-exporter-otlp>=1.43.0",
    "opentelemetry-sdk>=1.43.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "azure-identity>=1.24.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [".venv", ".agents"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
addopts = "-p no:phoenix -p no:langsmith_plugin --basetemp=.pytest_tmp"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: opt-in live CDC smoke checks (RUN_LIVE=1)"]
